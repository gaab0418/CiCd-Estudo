server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota que não seja um arquivo real cai no index.html
    # (senão dar F5 numa rota tipo /dashboard vira 404 no nginx)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

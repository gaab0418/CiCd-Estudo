name: Deploy Main (Produção)

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted]

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Copiar .env.production da pasta de segredos
        run: |
          test -f ~/deploy-secrets/cicd-estudo/.env.production || (echo "Falta ~/deploy-secrets/cicd-estudo/.env.production na máquina do runner. Veja o README." && exit 1)
          cp ~/deploy-secrets/cicd-estudo/.env.production .env.production

      - name: Build + sobe os containers de produção
        run: docker compose --env-file .env.production -p cicd-estudo-main up -d --build

      - name: Remove imagens antigas não usadas (limpeza)
        run: docker image prune -f

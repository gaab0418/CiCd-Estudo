name: Deploy Staging

# Só dispara quando alguém dá push (ou faz merge de PR) na branch "staging"
on:
  push:
    branches: [staging]

# Se dois pushes chegarem rápido, cancela o deploy antigo em vez de rodar os dois juntos
concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    # Isso aqui é a mágica do self-hosted runner: em vez de "ubuntu-latest" (máquina
    # efêmera do GitHub), o job roda direto na sua VM/WSL onde o runner está registrado.
    runs-on: [self-hosted]

    steps:
      # actions/checkout roda "git clean -ffdx" antes de baixar o código — isso apaga
      # QUALQUER arquivo não rastreado pelo git, inclusive os que estão no .gitignore.
      # Por isso o .env.staging não pode viver dentro desta pasta: ele seria apagado
      # a cada execução. Ele mora em ~/deploy-secrets/ (fora do que o checkout gerencia)
      # e é copiado pra cá depois do checkout, sempre do zero.
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Copiar .env.staging da pasta de segredos
        run: |
          test -f ~/deploy-secrets/cicd-estudo/.env.staging || (echo "Falta ~/deploy-secrets/cicd-estudo/.env.staging na máquina do runner. Veja o README." && exit 1)
          cp ~/deploy-secrets/cicd-estudo/.env.staging .env.staging

      - name: Build + sobe os containers de staging
        run: docker compose --env-file .env.staging -p cicd-estudo-staging up -d --build

      - name: Remove imagens antigas não usadas (limpeza)
        run: docker image prune -f
